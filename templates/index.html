<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geometry AI - Quantum</title>
    <!-- O ?v=2 impede o navegador de usar a versão em cache -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=2">
</head>
<body>

    <div class="chat-wrapper" id="chat-wrapper">
        <header>
            <div class="header-left">
                <div class="status-online"></div>
                <h1>Geometry AI</h1>
            </div>
            
            <div class="header-controls">
                <!-- Botão de Alternar Tema -->
                <button type="button" id="theme-toggle" class="theme-btn" title="Alternar Tema">
                    <span id="theme-icon">☀️</span>
                </button>

                <!-- Switch de Raciocínio -->
                <div class="reasoning-panel">
                    <span class="reasoning-label">Raciocínio</span>
                    <label class="switch">
                        <input type="checkbox" id="reasoning-toggle">
                        <span class="slider"></span>
                    </label>
                </div>
            </div>
        </header>

        <div id="chat-container">
            <div class="message bot">Olá! Eu sou a Geometry AI. Como posso ajudar?</div>
        </div>

        <div class="input-area">
            <input type="text" id="user-input" placeholder="Pergunte algo...">
            <button type="button" id="send-btn">Enviar</button>
        </div>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}?v=2"></script>
</body>
</html>
